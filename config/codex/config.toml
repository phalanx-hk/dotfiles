model = "gpt-5.5"
model_reasoning_effort = "high"
hide_agent_reasoning = true
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = false
writable_roots = ["~/Google Drive/マイドライブ/Obsidian Vault/"]

[tui]
status_line = ["model-with-reasoning", "current-dir", "context-usage", "five-hour-limit", "weekly-limit"]

# macOS only: plays a sound on task completion
notify = ["bash", "-lc", "afplay /System/Library/Sounds/Ping.aiff"]

[profiles.readonly]
approval_policy = "untrusted"
sandbox_mode = "read-only"
